[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
audio_structs = { workspace = true }
# 0.39.x тянет libsqlite3-sys 0.37.0 — ДО того, как 0.38.1 начал использовать
# нестабильный `cfg_select!` в build.rs (ломает сборку на стабильном Rust старее
# того, где `cfg_select` стабилизирован). Используемый нами API rusqlite в этих
# версиях идентичен. См. также обсуждение сборки под Windows.
rusqlite = { version = "0.39", features = ["bundled"] }
fastrand = "2.4.1"

[dev-dependencies]
tempfile = "3.24.0"
