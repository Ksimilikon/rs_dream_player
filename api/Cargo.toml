[package]
name = "api"
version = "0.1.0"
edition = "2024"

# ядро как динамическая библиотека (C-ABI, символы `idx_*`/`engine_*`),
# плюс rlib — чтобы крейт можно было линковать из тестов/других крейтов.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core = { workspace = true }
audio = { workspace = true }
audio_structs = { workspace = true }
storage = { workspace = true }

libloading = "0.9.0"
