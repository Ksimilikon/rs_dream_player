[package]
name = "vpair"
version = "0.1.0"
edition = "2024"

[dependencies]
storage = { workspace = true }
# X25519 key pair of the current device; `static_secrets` — a secret that can
# be stored to a file (the ephemeral one can't). The secret is zeroized on drop.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# OS CSPRNG for generating the key pair.
rand_core = { version = "0.6", features = ["getrandom"] }
# packet encryption (see `crypt.rs`): ChaCha20-Poly1305 AEAD with the key
# derived by HKDF-SHA256 from X25519 shared secrets.
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3.24.0"
