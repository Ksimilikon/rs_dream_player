# Export the binary's dynamic symbols so mods loaded at runtime via libloading
# (dlopen) can resolve the `extern "C"` API functions (next, prev, get_playlist,
# ...). Without this the symbols stay private to the executable and mods fail to
# link against them. (cfg(unix) => not applied when cross-building for Windows.)
[target.'cfg(unix)']
rustflags = ["-C", "link-args=-rdynamic"]

# Cross-compilation Linux -> Windows (GNU ABI). Requires the installed
# `x86_64-pc-windows-gnu` target and MinGW-w64 (gcc/ar) — it also compiles the
# bundled sqlite3.c. Build: `cargo build --target x86_64-pc-windows-gnu`.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
