[package]
name = "dbus"
version = "0.1.0"
edition = "2024"

[features]
# ВНИМАНИЕ: Windows-бэкенд (SMTC через souvlaki) опирается на окно консоли
# (`GetConsoleWindow`) и потому работает ТОЛЬКО в TUI-сборке. Он компилируется и
# используется лишь при включённом `with_tui`; при простой сборке под Windows
# (без флага) этот модуль и его зависимости (souvlaki/windows) не собираются, а
# вместо них берётся пустая заглушка (`fallback`). Настоящий GUI/FFI-фронтенд
# должен будет отдать ядру свой хендл окна и заменить этот модуль.
with_tui = ["dep:souvlaki", "dep:windows"]

# Linux: нативный MPRIS через zbus (текущая реализация, от TUI не зависит).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.16.0"

# Windows: системный медиа-транспорт (SMTC) через кроссплатформенную souvlaki.
# Своё скрытое окно-опору для SMTC создаём через windows-crate (регистрация
# класса, создание окна, насос сообщений). Обе зависимости опциональны и
# подтягиваются только фичей `with_tui` (см. выше).
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = { version = "0.8.3", optional = true }
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    # нужен для WNDCLASSEXW (поле hbrBackground: HBRUSH) и его Default.
    "Win32_Graphics_Gdi",
    # свой доступ к SMTC (тот же объект, что у souvlaki) ради очистки обложки:
    # Media — SystemMediaTransportControls/DisplayUpdater, WinRT — interop-фабрика.
    "Media",
    "Win32_System_WinRT",
] }
