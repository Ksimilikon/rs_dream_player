[package]
name = "dream_player"
version = "0.1.1"
edition = "2024"

[workspace]
members = [
  "audio",
  "api",
  "audio_structs",
  "storage",
  "tui",
  "notify_hub",
  "core",
]
resolver = "2"

[workspace.dependencies]
api = { path = "api" }
audio = { path = "audio" }
audio_structs = { path = "audio_structs" }
storage = { path = "storage" }
tui = { path = "tui" }
core = { path = "core" }

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "1"

# фронтенд (TUI) и хранилище (нужно config.rs для имени файла бд).
tui = { workspace = true }
storage = { workspace = true }

[dev-dependencies]
audio_structs = { workspace = true }
tempfile = "3.24.0"
serial_test = "3.3.1"
get-size = "0.1.4"
