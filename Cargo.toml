[package]
name = "dream_player"
version = "0.1.2"
edition = "2024"

[workspace]
members = [
  "audio",
  "api",
  "audio_structs",
  "storage",
  "tui",
  "notify_hub",
  "core", "codec",
]
resolver = "2"

[workspace.dependencies]
api = { path = "api" }
audio = { path = "audio" }
audio_structs = { path = "audio_structs" }
storage = { path = "storage" }
tui = { path = "tui" }
core = { path = "core" }
codec = { path = "codec" }

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "dream_player_tui"
path = "src/main.rs"
required-features = ["cli"]

# By default ONLY the core library is built (cdylib/staticlib), re-exporting
# the FFI from `api` — without the TUI and other binary extras.
[dependencies]
api = { workspace = true }

# Everything below is needed only by the demo binary (TUI); enabled by the
# `cli` feature.
tui = { workspace = true, optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
directories = { version = "6.0.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
# storage provides config.rs (the db file name), needed only in the binary.
storage = { workspace = true, optional = true }

[features]
# `cli` adds the demo binary `dream_player_tui` on top of the core library:
#   cargo build                 -> core only (lib), no TUI
#   cargo build --features cli  -> plus the binary with the TUI
cli = ["dep:tui", "dep:clap", "dep:directories", "dep:serde", "dep:toml", "dep:storage"]

[dev-dependencies]
storage = { workspace = true }
audio_structs = { workspace = true }
tempfile = "3.24.0"
serial_test = "3.3.1"
get-size = "0.1.4"
