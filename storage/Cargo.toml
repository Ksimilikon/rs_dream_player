[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
audio_structs = { workspace = true }
# 0.39.x pulls libsqlite3-sys 0.37.0 — BEFORE 0.38.1 started using the
# unstable `cfg_select!` in build.rs (it breaks the build on stable Rust older
# than the one where `cfg_select` is stabilized). The rusqlite API we use is
# identical in these versions. See also the discussion of the Windows build.
rusqlite = { version = "0.39", features = ["bundled"] }
fastrand = "2.4.1"

[dev-dependencies]
tempfile = "3.24.0"
